    <style>
        #replay {
            position: fixed;
            right: max(16px, env(safe-area-inset-right) + 10px);
            bottom: max(18px, env(safe-area-inset-bottom));
            z-index: 12;
            padding: 9px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.16);
            color: #ffd86b;
            font-family: inherit;
            font-size: 0.86rem;
            cursor: pointer;
            backdrop-filter: blur(6px);
        }

        #replay:hover {
            background: rgba(255, 255, 255, 0.28);
        }

        #music-toggle {
            position: fixed;
            top: max(16px, env(safe-area-inset-top));
            right: max(16px, env(safe-area-inset-right));
            z-index: 12;
            padding: 7px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.14);
            color: #ffd86b;
            font-size: 0.78rem;
            letter-spacing: 0.04em;
            cursor: pointer;
            backdrop-filter: blur(6px);
            user-select: none;
        }

        #music-toggle:hover {
            background: rgba(255, 255, 255, 0.24);
        }

        #view-toggle {
            position: fixed;
            top: calc(max(16px, env(safe-area-inset-top)) + 42px);
            right: max(16px, env(safe-area-inset-right));
            z-index: 12;
            padding: 7px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.14);
            color: #ffd86b;
            font-size: 0.78rem;
            letter-spacing: 0.04em;
            cursor: pointer;
            backdrop-filter: blur(6px);
            user-select: none;
        }

        #view-toggle:hover {
            background: rgba(255, 255, 255, 0.24);
        }

        #bgm {
            display: none;
        }

        .hint {
            max-width: 66vw;
            text-align: center;
            white-space: normal;
            line-height: 1.5;
        }

        #vignette {
            position: fixed;
            inset: 0;
            z-index: 6;
            pointer-events: none;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 42%, rgba(0, 0, 0, 0.5) 100%);
        }

        #loading {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: #01020a;
            color: #fff;
            transition: opacity 0.9s ease, visibility 0.9s;
        }

        #loading.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-star {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffd86b;
            box-shadow: 0 0 24px 8px rgba(255, 200, 80, 0.6);
            animation: loadingPulse 1.6s ease-in-out infinite;
        }

        @keyframes loadingPulse {
            0%, 100% { transform: scale(0.7); opacity: 0.5; }
            50% { transform: scale(1.4); opacity: 1; }
        }

        #loading p {
            font-size: 1rem;
            letter-spacing: 0.12em;
        }

        #loading span {
            font-size: 0.78rem;
            opacity: 0.55;
            letter-spacing: 0.06em;
        }

        #slow-tip {
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        #slow-tip.show {
            opacity: 0.8;
        }
    </style>

        window._hmt = window._hmt || [];

<body>
    <canvas id="scene"></canvas>

    <div id="loading">
        <div class="loading-star"></div>
        <p>正在准备 3D 生日场景…</p>
        <span>第一次加载需要一点耐心</span>
        <span id="slow-tip">网络有点慢，再等等…</span>
    </div>

    <div id="vignette"></div>

    <div class="hud">
        <a class="back" href="./index.html?mode=2d">← 返回经典 2D</a>
        <h1 id="scene-title">生日快乐</h1>
        <p>点击吹灭蜡烛，拖动换角度，右上角还可以看银河。</p>
    </div>

    <div class="fallback" id="fallback">
        3D 场景启动失败。<br><br>
        <a href="./index.html?mode=2d" style="color:#ffd86b;">返回经典 2D 版本</a>
    </div>

    <button id="replay" type="button">再看一次</button>

    <div id="music-toggle" role="button" tabindex="0" aria-label="播放或暂停背景音乐">音乐开</div>

    <div id="view-toggle" role="button" tabindex="0" aria-label="切换到银河视角">看银河</div>

    <audio id="bgm" loop preload="metadata" playsinline>
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>

    <script>
        window.__demoReady = false;

        function showDemoError(message) {
            if (window.__demoReady) return;
            var loading = document.getElementById('loading');
            if (loading) loading.classList.add('hidden');
            var box = document.getElementById('fallback');
            if (!box) return;
            box.style.display = 'flex';
            box.innerHTML = message + '<br><br><a href="./index.html?mode=2d" style="color:#ffd86b;">返回经典 2D 版本</a>';
        }

        window.addEventListener('error', function (event) {
            showDemoError('3D 没有启动：' + (event.message || '模块加载失败') +
                '<br><br>建议用 Chrome / Edge，或回到 2D 版本。');
        });

        if (location.protocol === 'file:') {
            showDemoError('3D 场景需要通过本地服务器或线上地址打开。<br><br>建议使用 Chrome / Edge，或返回经典 2D 版本。');
        }

        setTimeout(function () {
            var tip = document.getElementById('slow-tip');
            if (tip) tip.classList.add('show');
        }, 8000);

        // 背景音乐：第一次点击页面时开始播放
        var audio = document.getElementById('bgm');
        var musicToggle = document.getElementById('music-toggle');

        function toggleMusic() {
            if (audio.paused) {
                audio.play().catch(function () {});
                musicToggle.textContent = '音乐开';
            } else {
                audio.pause();
                musicToggle.textContent = '音乐关';
            }
        }

        musicToggle.addEventListener('click', toggleMusic);
        musicToggle.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                toggleMusic();
            }
        });

        document.addEventListener('pointerdown', function () {
            if (audio.paused) {
                audio.volume = 0.55;
                audio.play().catch(function () {});
                musicToggle.textContent = '音乐开';
            }
        }, { once: true });
    </script>

    <script type="module" src="./js/three-birthday.js?v=20261117o"></script>
</body>
</html>
